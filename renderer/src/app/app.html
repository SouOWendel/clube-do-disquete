<div class="flex h-screen flex-col">
  <!-- Wallpaper (área de trabalho) -->
  <main class="relative flex flex-1 items-center justify-center overflow-hidden bg-win-wallpaper">
    @if (drawOpen()) {
      <app-draw-window (closed)="drawOpen.set(false)" />
    }
  </main>

  <app-taskbar [drawOpen]="drawOpen()" (drawClick)="drawOpen.set(true)" />
</div>
