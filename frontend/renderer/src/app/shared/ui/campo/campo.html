@if (rotulo(); as texto) {
  <label [class]="classesRotulo()" [for]="id">{{ texto }}</label>
}

<div class="items-center gap-e3" [class]="classesCaixa()">
  @if (icone(); as nome) {
    <app-icone [nome]="nome" />
  }
  <input
    class="min-w-0 flex-1 border-0 bg-transparent p-0 texto-corpo text-texto-padrao outline-none placeholder:text-texto-secundario disabled:text-texto-desabilitado"
    [id]="id"
    [type]="tipo()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [attr.maxlength]="maxlength() ?? null"
    [value]="valor()"
    [disabled]="desabilitado()"
    [attr.aria-label]="rotulo() ? null : placeholder()"
    [attr.aria-invalid]="erro() ? true : null"
    [attr.aria-describedby]="erro() || ajuda() ? idAjuda : null"
    (input)="alterar($any($event.target).value)"
    (focus)="focado.set(true)"
    (blur)="sair()"
  />
</div>

@if (erro() || ajuda()) {
  <app-mensagem-de-ajuda [id]="idAjuda" [erro]="erro()" [ajuda]="ajuda()" />
}
