<footer class="bevel-out flex h-9 items-center gap-1 bg-win-gray px-1 font-win text-sm text-black">
  <button
    type="button"
    class="flex h-7 w-36 items-center px-3 tracking-wide active:bevel-pressed"
    [class]="drawOpen() ? 'bevel-pressed bg-[#dcdcdc]' : 'bevel-out bg-win-gray'"
    (click)="drawClick.emit()"
  >
    DRAW
  </button>

  <!-- Bandeja do sistema (relógio) -->
  <div class="bevel-in ml-auto flex h-7 w-36 items-center justify-between px-3">
    <span>{{ time() }}</span>
    <span class="h-3.5 w-3 bg-yellow-400" aria-hidden="true"></span>
  </div>
</footer>
